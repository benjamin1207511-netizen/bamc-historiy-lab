<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMC HISTORY LAB</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2c;--panel2:#122238;--line:#233852;--text:#e7f0fa;--muted:#8da4bd;--cyan:#56e0c2;--blue:#70b7ff;--amber:#ffc477;--red:#ff7e88;--purple:#c6a0ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#102541 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{border-bottom:1px solid var(--line);background:#07111fdd;position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}.nav{max-width:1440px;margin:auto;padding:14px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:19px;font-weight:850;letter-spacing:.4px}.brand b{color:var(--cyan)}.tag{font-size:11px;color:var(--cyan);border:1px solid #2e756c;padding:4px 8px;border-radius:20px}.navright{margin-left:auto;color:var(--muted);font-size:12px}main{max-width:1440px;margin:24px auto;padding:0 22px 40px}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;margin-bottom:18px;min-height:36px}.hero h1{font-size:clamp(25px,3vw,36px);line-height:1.15;margin:0 0 8px}.hero p{color:var(--muted);margin:0;max-width:850px}.status{font-size:12px;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:9px;white-space:nowrap;flex:0 0 auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 14px}.tab{border:1px solid var(--line);background:var(--panel);color:#b9c9da;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700}.tab.active{background:#153b43;border-color:#2a8b7e;color:#d9fff7}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.panel{background:linear-gradient(160deg,#102036,#0b1727);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0;box-shadow:0 12px 30px #00000018}.panel h2{font-size:15px;margin:0 0 14px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;color:#a7bbd0;margin-bottom:6px}.field input,.field select{width:100%;background:#081525;color:var(--text);border:1px solid #2a405a;border-radius:8px;padding:10px 11px;outline:none;min-width:0}.field input:focus,.field select:focus{border-color:var(--cyan)}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;gap:7px;align-items:center;color:#c5d4e4;font-size:12px}.check input{accent-color:var(--cyan)}button{font:inherit}.primary,.secondary{border:1px solid #2b8c7f;background:#1b6c65;color:white;border-radius:9px;padding:11px 14px;font-weight:800;cursor:pointer}.secondary{background:#15253a;border-color:#314966;color:#d7e7f7}.primary:disabled{opacity:.5;cursor:wait}.actions{display:flex;gap:8px;flex-wrap:wrap}.hint{font-size:11px;color:var(--muted);margin-top:9px}.right{display:grid;gap:14px}.topline{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.kpi{background:#091728;border:1px solid var(--line);border-radius:10px;padding:12px}.kpi small{display:block;color:var(--muted);font-size:11px}.kpi strong{display:block;font-size:21px;margin-top:5px;letter-spacing:-.4px}.chart-wrap{position:relative;height:330px;margin-top:8px}canvas{width:100%;height:100%;display:block}.chart-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:8px}.legend-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.table-wrap{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}th,td{text-align:right;padding:9px 10px;border-bottom:1px solid #1d3047}th{position:sticky;top:0;background:#13243a;color:#b8cbe0;font-weight:700}td:first-child,th:first-child{text-align:left}tbody tr:hover{background:#14263b}.apiurl{overflow-wrap:anywhere;color:#a6c9e9;font-size:11px;background:#081525;padding:10px;border-radius:8px;border:1px solid var(--line)}.notice{border:1px solid #715b2d;background:#2b2416;color:#f0d8a2;padding:11px 13px;border-radius:10px;font-size:12px}.error{border-color:#773b48;background:#2a1820;color:#ffb6c0}.hidden{display:none!important}.pill{display:inline-block;font-size:10px;color:#b5c8dc;background:#192b41;border:1px solid #30465e;border-radius:20px;padding:3px 7px;margin-right:4px}@media(max-width:980px){.layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.navright{margin-left:0}}@media(max-width:560px){main{padding:0 12px 28px;margin-top:16px}.nav{padding:12px}.panel{padding:13px}.two{grid-template-columns:1fr 1fr}.chart-wrap{height:270px}.kpi strong{font-size:18px}.hero{align-items:center;gap:8px}.status{font-size:11px;padding:6px 8px}.tag{display:none}}

/* BAMC light blue / white redesign */
:root{--bg:#f3f8ff;--panel:#ffffff;--panel2:#f5f9ff;--line:#d5e5f7;--text:#183452;--muted:#6b829c;--cyan:#1683dc;--blue:#287fe0;--amber:#d88b22;--red:#d94e62;--purple:#805ad5}
body{background-color:#f4f8fd;background-image:linear-gradient(rgba(244,248,253,.90),rgba(244,248,253,.90)),var(--user-bg-image, none);background-size:cover;background-position:center;background-attachment:fixed;color:var(--text)}
header{background:rgba(255,255,255,.96);border-bottom:1px solid #d9e8f8;box-shadow:0 3px 16px #1b5d9510}
.nav{gap:12px;position:relative}.brand{color:#174b82;font-size:20px;letter-spacing:.7px}.bg-tools{margin-left:auto;position:relative}.bg-toggle{padding:8px 11px;border:1px solid #b9d4f0;border-radius:9px;background:#fff;color:#2469a6;font-weight:700;cursor:pointer}.bg-panel{position:absolute;right:0;top:calc(100% + 10px);z-index:30;width:min(340px,calc(100vw - 28px));padding:14px;border:1px solid #cfe2f7;border-radius:12px;background:#fff;box-shadow:0 14px 40px #174b8224}.bg-panel label{display:block;font-size:12px;color:#526e8b;margin:0 0 5px}.bg-panel input[type=url],.bg-panel input[type=file]{width:100%;margin-bottom:10px;font:inherit;font-size:12px;color:#365575}.bg-panel input[type=url]{padding:9px;border:1px solid #c9dced;border-radius:8px}.bg-panel .actions{gap:7px}.bg-panel .secondary,.bg-panel .primary{padding:8px 10px;font-size:12px}.brand b{color:#2386df}
.logo-slot{width:38px;height:38px;border:1.5px dashed #8bb9e8;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;background:#f2f8ff;color:#397dbb;font-size:9px;font-weight:800;flex:none}.logo-slot img{width:100%;height:100%;object-fit:contain}
main{margin-top:10px}.hero h1{color:#174b82}.hero p{color:#68819c}.status{border-color:#d4e5f8;background:#fff;color:#53718f}
.tabs{margin-top:8px;margin-bottom:10px;align-items:center;gap:7px}.tab{background:#fff;border-color:#d1e2f5;color:#446483}.tab.active{background:#e4f2ff;border-color:#70b2ef;color:#1264ac}
.panel{background:#fff;border-color:#d7e6f6;box-shadow:0 5px 20px #255b8a0b}.field label{color:#526e8b}.field input,.field select{background:#fbfdff;color:#1e3e5f;border-color:#c9dced}.field input:focus,.field select:focus{border-color:#398fe0}
.check{color:#365575}.check input{accent-color:#2386df}.primary,.secondary{background:#247fd0;border-color:#247fd0;color:white}.secondary{background:#fff;border-color:#b9d4f0;color:#2469a6}.kpi{background:#f6faff;border-color:#dbe9f8}.kpi small{color:#6d849d}.kpi strong{color:#1b5d99}
th{background:#eaf4ff;color:#28557e}th,td{border-bottom-color:#e3edf8}tbody tr:hover{background:#f2f8ff}.table-wrap{border-color:#d9e7f5}.chart-legend{color:#607b96}.notice{border-color:#bad9f8;background:#eff7ff;color:#285c8e}.error{border-color:#f1c5cb;background:#fff3f4;color:#a72f40}.pill{color:#416b95;background:#edf6ff;border-color:#d4e6f8}.hint{color:#7289a1}
@media(max-width:560px){.logo-slot{width:34px;height:34px}.brand{font-size:18px}.bg-tools{margin-left:auto}.bg-toggle{font-size:12px;padding:7px 8px}.tabs{align-items:center}.status{margin-left:auto}}
</style>
</head>
<body>
<header><div class="nav"><div class="logo-slot" title="BAMC 宝安中学气象社标志"><img src="bamc-logo.png" alt="BAMC 宝安中学气象社标志"></div><div class="brand">BAMC HISTORY LAB</div><div class="bg-tools"><button type="button" class="bg-toggle" id="bgToggle" aria-expanded="false">设置背景图</button><div class="bg-panel hidden" id="bgPanel"><label for="bgUrl">背景图片网址（URL）</label><input id="bgUrl" type="url" placeholder="https://example.com/background.jpg"><label for="bgFile">或从设备选择图片</label><input id="bgFile" type="file" accept="image/*"><div class="actions"><button type="button" class="primary" id="bgApply">应用背景</button><button type="button" class="secondary" id="bgRemove">移除背景</button></div><div class="hint">背景图只在当前页面临时生效；建议使用宽幅图片，页面会加一层浅色遮罩以保证文字清晰。</div></div></div></div></header>
<main>
<div class="tabs">
<button class="tab active" data-tab="weather">历史天气 / 再分析</button>
<button class="tab" data-tab="forecast">历史连续预报</button>
<button class="tab" data-tab="run">单次起报回放</button>
<button class="tab" data-tab="previous">历史预报提前量</button>
<div id="status" class="status">等待查询</div>
</div>
<div class="layout">
<aside class="panel">
<h2>查询参数</h2>
<div class="field"><label for="place">地点名称（可选，用于备注）</label><input id="place" value="中国深圳" placeholder="例如：中国深圳"></div>
<div class="two">
<div class="field"><label for="lat">纬度 Latitude</label><input id="lat" type="number" step="any" value="22.5431"></div>
<div class="field"><label for="lon">经度 Longitude</label><input id="lon" type="number" step="any" value="114.0579"></div>
</div>
<div class="field"><label for="timezone">时区</label><select id="timezone"><option value="UTC" selected>UTC</option><option value="Asia/Shanghai">北京时间（UTC+8）</option></select></div>
<div class="field"><label for="model">数据集 / 模式</label><select id="model"></select></div>
<div class="two">
<div class="field"><label for="start">开始日期</label><input id="start" type="date" value="2025-08-01"></div>
<div class="field"><label for="end">结束日期</label><input id="end" type="date" value="2025-08-03"></div>
</div>
<div id="runField" class="field hidden"><label for="runDate">起报时间（UTC，单次起报）</label><input id="runDate" type="datetime-local" value="2026-10-14T00:00"><div class="hint">起报时间按 UTC 输入。多数模式的历史单次起报档案从 2026-04-02 起；ECMWF IFS HRES 可追溯至 2024-03-14。请选择该模式实际存在的起报时次（通常为 00、06、12、18 UTC），并预留约 4–6 小时等待全球模式完成发布。</div></div>
<div class="field"><label>查询要素</label><div class="checks" id="variables">
<label class="check"><input type="checkbox" value="temperature_2m" checked> 2米气温</label>
<label class="check"><input type="checkbox" value="dew_point_2m" checked> 2米露点</label>
<label class="check"><input type="checkbox" value="relative_humidity_2m" checked> 相对湿度</label>
<label class="check"><input type="checkbox" value="precipitation" checked> 降水</label>
<label class="check"><input type="checkbox" value="wind_speed_10m" checked> 10米风速</label>
<label class="check"><input type="checkbox" value="wind_gusts_10m"> 阵风</label>
<label class="check"><input type="checkbox" value="wind_direction_10m"> 风向</label>
<label class="check"><input type="checkbox" value="pressure_msl" checked> 海平面气压</label>
<label class="check"><input type="checkbox" value="cloud_cover"> 总云量</label>
<label class="check"><input type="checkbox" value="surface_pressure"> 地面气压</label>
</div></div>
<div id="previousField" class="field hidden"><label for="pastDays">回看范围</label><select id="pastDays"><option value="7">过去 7 天</option><option value="14">过去 14 天</option><option value="30">过去 30 天</option></select><div class="hint">此接口返回按固定预报提前量对齐的数据；并非完整单次起报时序。</div></div>
<div class="actions"><button id="queryBtn" class="primary">查询数据</button><button id="resetBtn" class="secondary">重置</button></div>

</aside>
<section class="right">
<div class="panel"><div class="topline"><div><h2>查询结果</h2></div><div class="actions"><button id="csvBtn" class="secondary" disabled>导出 CSV</button></div></div>
<div class="kpis" id="kpis" style="margin-top:14px"><div class="kpi"><small>数据点</small><strong>—</strong></div><div class="kpi"><small>气温均值</small><strong>—</strong></div><div class="kpi"><small>最高气温</small><strong>—</strong></div><div class="kpi"><small>降水累计</small><strong>—</strong></div></div></div>
<div class="panel"><div class="topline"><div><h2>时间序列图</h2></div><div class="field" style="margin:0;min-width:180px"><label for="chartVar">图表显示要素</label><select id="chartVar"><option value="temperature_2m">2米气温 (°C)</option><option value="dew_point_2m">2米露点 (°C)</option><option value="relative_humidity_2m">相对湿度 (%)</option><option value="precipitation">降水 (mm)</option><option value="wind_speed_10m">10米风速 (km/h)</option><option value="wind_gusts_10m">阵风 (km/h)</option><option value="pressure_msl">海平面气压 (hPa)</option><option value="cloud_cover">总云量 (%)</option></select></div></div><div class="chart-wrap"><canvas id="chart"></canvas></div><div id="legend" class="chart-legend"></div></div>
<div class="panel"><div class="topline"><div><h2 style="margin-bottom:8px">数据表</h2></div></div><div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"><tr><td style="text-align:left;color:#8da4bd">等待查询数据……</td></tr></tbody></table></div></div>

<div id="errorBox" class="notice error hidden"></div>
</section></div>

</main>
<script>
const $=id=>document.getElementById(id);
const tabs={weather:{title:'历史天气 / 再分析',endpoint:'https://archive-api.open-meteo.com/v1/archive',models:[
['era5','ERA5 再分析（1940年起）'],
['era5_land','ERA5-Land 高分辨率再分析（1950年起）'],
['ecmwf_ifs025','ECMWF IFS 分析（约9 km，2017年起）']],api:'weather'},
forecast:{title:'历史连续预报',endpoint:'https://historical-forecast-api.open-meteo.com/v1/forecast',models:[
['ecmwf_ifs025','ECMWF IFS 0.25° 全球预报'],['gfs_seamless','GFS 全球连续预报'],['jma_seamless','JMA 全球连续预报'],['gem_seamless','GEM 全球连续预报'],['icon_seamless','ICON 全球连续预报']],api:'forecast'},
run:{title:'单次起报回放',endpoint:'https://single-runs-api.open-meteo.com/v1/forecast',models:[
['ecmwf_ifs','ECMWF IFS HRES 9 km 单次起报'],['gfs_global','GFS 全球模式单次起报'],['jma_gsm','JMA GSM 全球模式单次起报'],['gem_global','GEM 全球模式单次起报'],['icon_global','ICON 全球模式单次起报']],api:'run'},
previous:{title:'历史预报提前量',endpoint:'https://previous-runs-api.open-meteo.com/v1/forecast',models:[
['ecmwf_ifs025','ECMWF IFS 0.25° 单次起报'],['gfs_global','GFS 全球模式单次起报'],['jma_gsm','JMA GSM 全球模式单次起报'],['gem_global','GEM 全球模式单次起报'],['icon_global','ICON 全球模式单次起报']],api:'previous'}};
const varNames={temperature_2m:'2米气温 (°C)',dew_point_2m:'2米露点 (°C)',relative_humidity_2m:'相对湿度 (%)',precipitation:'降水 (mm)',wind_speed_10m:'10米风速 (km/h)',wind_gusts_10m:'阵风 (km/h)',wind_direction_10m:'10米风向 (°)',pressure_msl:'海平面气压 (hPa)',surface_pressure:'地面气压 (hPa)',cloud_cover:'总云量 (%)'};
const colors=['#56e0c2','#70b7ff','#ffc477','#ff7e88','#c6a0ff','#70d7a4','#e9a4d8'];
let active='weather',rows=[],columns=[],rawData=null,lastUrl='',activeData={},chartDpr=1;
function setStatus(t){$('status').textContent=t}
function setTab(name){active=name;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));$('runField').classList.toggle('hidden',name!=='run');$('previousField').classList.toggle('hidden',name!=='previous');populateModels();setStatus('等待查询')}
function populateModels(){const sel=$('model'),old=sel.value;sel.innerHTML=tabs[active].models.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');if(tabs[active].models.some(m=>m[0]===old))sel.value=old}
function selectedVars(){return [...document.querySelectorAll('#variables input:checked')].map(x=>x.value)}
function isoDate(d){return d.toISOString().slice(0,10)}
function buildUrl(){const cfg=tabs[active],u=new URL(cfg.endpoint);const p={latitude:$('lat').value,longitude:$('lon').value,timezone:$('timezone').value,models:$('model').value};const vars=selectedVars();if(!vars.length)throw Error('请至少选择一个查询要素。');if(active==='weather'){p.start_date=$('start').value;p.end_date=$('end').value;p.hourly=vars.join(',')}else if(active==='forecast'){p.start_date=$('start').value;p.end_date=$('end').value;p.hourly=vars.join(',')}else if(active==='run'){const runValue=$('runDate').value;if(!runValue)throw Error('请选择单次起报的 UTC 日期和时次。');if(!/T(00|06|12|18):00$/.test(runValue))throw Error('起报时间应使用有效的 UTC 起报时次，通常为 00:00、06:00、12:00 或 18:00。');if(runValue.slice(0,16)>new Date(Date.now()-4*3600000).toISOString().slice(0,16))throw Error('该起报时次可能尚未完成发布，请选择至少早于当前时间 4 小时的起报时次。');p.run=runValue;p.hourly=vars.join(',')}else{p.past_days=$('pastDays').value;p.forecast_days='1';p.hourly=vars.map(v=>v+'_previous_day1,'+v+'_previous_day2,'+v+'_previous_day3').join(',')}Object.entries(p).forEach(([k,v])=>{if(v!==''&&v!=null)u.searchParams.set(k,v)});return u.toString()}
function variableLabel(k){if(varNames[k])return varNames[k];let m=k.match(/(.+)_previous_day(\d+)/);if(m)return (varNames[m[1]]||m[1])+` · 提前${m[2]}天`;return k}
function getSeries(json){const h=json.hourly||json.hourly_units;if(!h||!h.time)throw Error('接口响应中没有 hourly.time，可能是该模式/日期/变量组合不可用。');const ts=h.time;const vals=Object.keys(h).filter(k=>k!=='time'&&Array.isArray(h[k]));const out=[];for(let i=0;i<ts.length;i++){const r={time:ts[i]};for(const k of vals)r[k]=h[k][i];out.push(r)}return {rows:out,columns:['time',...vals],units:json.hourly_units||{},meta:json}}
function fmt(v,d=1){return v==null||!Number.isFinite(Number(v))?'—':Number(v).toFixed(d)}
function avg(a){const x=a.filter(v=>Number.isFinite(Number(v))).map(Number);return x.length?x.reduce((s,v)=>s+v,0)/x.length:null}
function sum(a){const x=a.filter(v=>Number.isFinite(Number(v))).map(Number);return x.length?x.reduce((s,v)=>s+v,0):null}
function renderKpis(){const temp=rows.map(r=>r.temperature_2m).filter(Number.isFinite),prec=rows.map(r=>r.precipitation).filter(Number.isFinite);const k=[['数据点',rows.length.toLocaleString()],['气温均值',temp.length?fmt(avg(temp))+' °C':'—'],['最高气温',temp.length?fmt(Math.max(...temp))+' °C':'—'],['降水累计',prec.length?fmt(sum(prec))+' mm':'—']];$('kpis').innerHTML=k.map(([a,b])=>`<div class="kpi"><small>${a}</small><strong>${b}</strong></div>`).join('')}
function renderTable(){const shown=rows;$('thead').innerHTML='<tr>'+columns.map(k=>`<th>${k==='time'?'时间 ('+($('timezone').value==='UTC'?'UTC':$('timezone').value)+')':variableLabel(k)}</th>`).join('')+'</tr>';$('tbody').innerHTML=shown.map(r=>'<tr>'+columns.map(k=>`<td>${k==='time'?String(r[k]).replace('T',' '):fmt(r[k],k.includes('direction')?0:2)}</td>`).join('')+'</tr>').join('');}
function renderChart(){const c=$('chart'),rect=c.getBoundingClientRect();if(!rect.width||!rect.height)return;chartDpr=window.devicePixelRatio||1;c.width=Math.round(rect.width*chartDpr);c.height=Math.round(rect.height*chartDpr);const ctx=c.getContext('2d');ctx.scale(chartDpr,chartDpr);const w=rect.width,h=rect.height;ctx.clearRect(0,0,w,h);const key=$('chartVar').value;let series=rows.map(r=>Number(r[key]));if(!series.some(Number.isFinite)){ctx.fillStyle='#8da4bd';ctx.font='13px system-ui';ctx.fillText('当前查询结果不包含该要素，请勾选对应变量后重新查询。',20,40);$('legend').textContent='';return}const vals=series.filter(Number.isFinite),min=Math.min(...vals),max=Math.max(...vals),pad={l:55,r:18,t:20,b:43},pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;const lo=min===max?min-1:min-(max-min)*.08,hi=min===max?max+1:max+(max-min)*.08;ctx.font='10px system-ui';ctx.lineWidth=1;for(let i=0;i<=5;i++){let y=pad.t+ph*i/5,v=hi-(hi-lo)*i/5;ctx.strokeStyle='#233852';ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillStyle='#9bb0c6';ctx.textAlign='right';ctx.fillText(fmt(v,1),pad.l-8,y+3)}let tickCount= Math.min(6,rows.length);for(let i=0;i<tickCount;i++){const ix=Math.round(i*(rows.length-1)/Math.max(1,tickCount-1));let x=pad.l+pw*ix/Math.max(1,rows.length-1);ctx.strokeStyle='#233852';ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+ph);ctx.stroke();ctx.fillStyle='#9bb0c6';ctx.textAlign='center';ctx.fillText(String(rows[ix].time).replace('T',' ').slice(5,16),x,h-17)}ctx.strokeStyle=colors[0];ctx.lineWidth=2;ctx.beginPath();let started=false;series.forEach((v,i)=>{if(!Number.isFinite(v)){started=false;return}const x=pad.l+pw*i/Math.max(1,series.length-1),y=pad.t+ph*(hi-v)/(hi-lo);if(!started){ctx.moveTo(x,y);started=true}else ctx.lineTo(x,y)});ctx.stroke();ctx.fillStyle=colors[0];ctx.textAlign='left';ctx.font='11px system-ui';ctx.fillText(variableLabel(key),pad.l,pad.t-5);$('legend').innerHTML=`<span><i class="legend-dot" style="background:${colors[0]}"></i>${variableLabel(key)}</span><span>最小值 ${fmt(min,2)}</span><span>最大值 ${fmt(max,2)}</span><span>单位以变量名称为准</span>`}
function csvEscape(v){const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function downloadCsv(){const lines=[columns.map(k=>csvEscape(k==='time'?'time':variableLabel(k))).join(','),...rows.map(r=>columns.map(k=>csvEscape(r[k])).join(','))];const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`BAMC_${active}_${$('model').value}_${$('start').value||$('runDate').value.slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function query(){let url;try{if(!$('lat').value||!$('lon').value)throw Error('请填写经纬度。');if(Number($('lat').value)<-90||Number($('lat').value)>90||Number($('lon').value)<-180||Number($('lon').value)>180)throw Error('经纬度超出范围。');if(active!=='run'&&$('start').value&&$('end').value&&$('start').value>$('end').value)throw Error('开始日期不能晚于结束日期。');url=buildUrl()}catch(e){showError(e.message);return}lastUrl=url;$('queryBtn').disabled=true;$('queryBtn').textContent='查询中…';$('errorBox').classList.add('hidden');setStatus('正在请求接口…');try{const res=await fetch(url);const txt=await res.text();let j;try{j=JSON.parse(txt)}catch{throw Error(`接口返回非 JSON 内容（HTTP ${res.status}）。`)}if(!res.ok||j.error)throw Error(j.reason||j.message||`接口请求失败：HTTP ${res.status}`);rawData=j;const got=getSeries(j);rows=got.rows;columns=got.columns;activeData=got;renderKpis();renderTable();renderChart();$('csvBtn').disabled=false;setStatus('查询成功 · '+new Date().toLocaleTimeString());}catch(e){showError((e.message||String(e))+'。请检查该模式的历史覆盖范围、参数名称或稍后重试。');setStatus('查询失败')}finally{$('queryBtn').disabled=false;$('queryBtn').textContent='查询数据'}}
function showError(s){$('errorBox').textContent=s;$('errorBox').classList.remove('hidden');setStatus('查询失败')}
function reset(){ $('place').value='中国深圳';$('lat').value='22.5431';$('lon').value='114.0579';$('timezone').value='UTC';$('start').value='2025-08-01';$('end').value='2025-08-03';$('runDate').value='2026-10-14T00:00';document.querySelectorAll('#variables input').forEach((x,i)=>x.checked=i<6||x.value==='pressure_msl');$('chartVar').value='temperature_2m';$('errorBox').classList.add('hidden');}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('queryBtn').addEventListener('click',query);$('resetBtn').addEventListener('click',()=>{reset();setTab(active);setStatus('已重置参数')});$('csvBtn').addEventListener('click',downloadCsv);$('chartVar').addEventListener('change',renderChart);window.addEventListener('resize',renderChart);
$('start').addEventListener('change',()=>{if($('end').value<$('start').value)$('end').value=$('start').value});
let bgObjectUrl='';$('bgToggle').addEventListener('click',()=>{const open=$('bgPanel').classList.toggle('hidden')===false;$('bgToggle').setAttribute('aria-expanded',String(open))});$('bgApply').addEventListener('click',()=>{const file=$('bgFile').files[0],url=$('bgUrl').value.trim();if(file){if(bgObjectUrl)URL.revokeObjectURL(bgObjectUrl);bgObjectUrl=URL.createObjectURL(file);document.body.style.setProperty('--user-bg-image',`url(\"${bgObjectUrl}\")`);$('bgPanel').classList.add('hidden');$('bgToggle').setAttribute('aria-expanded','false');return}if(url){try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw Error();document.body.style.setProperty('--user-bg-image',`url(\"${parsed.href.replace(/\"/g,'%22')}\")`);$('bgPanel').classList.add('hidden');$('bgToggle').setAttribute('aria-expanded','false')}catch{$('bgUrl').setCustomValidity('请输入有效的 http 或 https 图片网址。');$('bgUrl').reportValidity();$('bgUrl').setCustomValidity('')}}else{$('bgFile').click()}});$('bgRemove').addEventListener('click',()=>{document.body.style.removeProperty('--user-bg-image');$('bgUrl').value='';$('bgFile').value='';if(bgObjectUrl){URL.revokeObjectURL(bgObjectUrl);bgObjectUrl=''}$('bgPanel').classList.add('hidden');$('bgToggle').setAttribute('aria-expanded','false')});$('bgFile').addEventListener('change',()=>{if($('bgFile').files[0])$('bgUrl').value=''});
setTab('weather');renderChart();
</script>
